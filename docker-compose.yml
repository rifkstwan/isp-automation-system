# ============================================================
#  WiFi Management - Docker Compose (Development)
#  Untuk 2 developer: jalankan `docker compose up -d`
# ============================================================

services:

  # ─────────────── DATABASE ───────────────
  postgres:
    image: postgres:16-alpine
    container_name: wifi_postgres
    restart: unless-stopped
    env_file:
      - .env.docker          # Secret: POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: wifi_management_db
      POSTGRES_USER: wifi_user
      # POSTGRES_PASSWORD dibaca dari .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # Bisa diakses dari DBeaver/TablePlus di host
    networks:
      - wifi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifi_user -d wifi_management_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────── BACKEND (Laravel) ───────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wifi_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html          # Hot-reload: mount kode langsung
      - backend_vendor:/var/www/html/vendor  # Vendor tetap di container
    env_file:
      - .env.docker          # Secret: DB password, email, Midtrans key
    environment:
      APP_NAME: "WiFi Management"
      APP_ENV: local
      APP_DEBUG: "true"
      # APP_KEY dibaca dari .env.docker
      APP_URL: http://localhost
      # Database - gunakan nama service 'postgres', bukan 127.0.0.1
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: wifi_management_db
      DB_USERNAME: wifi_user
      # DB_PASSWORD dibaca dari .env.docker
      # Frontend & CORS
      FRONTEND_URL: http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:5173,localhost:80,127.0.0.1,127.0.0.1:5173"
      SESSION_DOMAIN: localhost
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      # Cache & Queue
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      # Email config (non-secret)
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_ENCRYPTION: tls
      MAIL_FROM_NAME: "CV Citra Mandiri"
      # MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM_ADDRESS dibaca dari .env.docker
      # Midtrans
      MIDTRANS_IS_PRODUCTION: "false"
      # MIDTRANS_MERCHANT_ID, MIDTRANS_CLIENT_KEY, MIDTRANS_SERVER_KEY dibaca dari .env.docker
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wifi_network

  # ─────────────── FRONTEND (React + Vite) ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wifi_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app                        # Hot-reload: mount kode langsung
      - frontend_node_modules:/app/node_modules  # node_modules di container
    ports:
      - "5173:5173"   # Akses frontend: http://localhost:5173
    env_file:
      - .env.docker          # Secret: VITE_MIDTRANS_CLIENT_KEY
    environment:
      VITE_API_URL: http://localhost
      # VITE_MIDTRANS_CLIENT_KEY dibaca dari .env.docker
    networks:
      - wifi_network

  # ─────────────── NGINX (Reverse Proxy untuk Backend) ───────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: wifi_nginx
    restart: unless-stopped
    ports:
      - "80:80"   # Akses backend API: http://localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - backend
    networks:
      - wifi_network

# ─────────────── NETWORKS ───────────────
networks:
  wifi_network:
    driver: bridge

# ─────────────── VOLUMES ───────────────
volumes:
  postgres_data:       # Data PostgreSQL (persisten)
  backend_vendor:      # Composer vendor (di dalam container)
  frontend_node_modules:  # node_modules frontend (di dalam container)
